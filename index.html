<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Habit Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
body{background:#0b1220;color:#e5e7eb;min-height:100vh;padding:24px;}
.wrap{max-width:480px;margin:0 auto;}
h1{font-size:26px;margin-bottom:4px;}
.sub{color:#94a3b8;font-size:13px;margin-bottom:18px;}
.addrow{display:flex;gap:10px;margin-bottom:18px;}
.addrow input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #1f2a44;background:#151f32;color:#e5e7eb;font-size:14px;}
.addrow button{padding:12px 20px;border:none;border-radius:12px;background:#6366f1;color:#fff;font-weight:600;cursor:pointer;}
.card{background:#151f32;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #334155;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.cb.done{background:#6366f1;border-color:#6366f1;}
.name{flex:1;font-size:15px;}
.name.done{text-decoration:line-through;color:#94a3b8;}
.del{background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:18px;padding:4px 8px;}
.empty{text-align:center;color:#94a3b8;padding:40px 0;}
.ai{margin-top:24px;background:#151f32;border-radius:14px;padding:14px;}
.ai h3{font-size:14px;margin-bottom:8px;color:#94a3b8;}
.airow{display:flex;gap:8px;}
.airow input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #1f2a44;background:#0f172a;color:#e5e7eb;font-size:13px;}
.airow button{padding:10px 14px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:600;cursor:pointer;}
.aireply{margin-top:10px;font-size:13px;color:#e5e7eb;white-space:pre-wrap;min-height:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Habit Tracker</h1>
  <div class="sub" id="sub">0 of 0 done today</div>
  <div class="addrow">
    <input id="habitInput" placeholder="New habit..." />
    <button id="addBtn">+ Add</button>
  </div>
  <div id="list"></div>
  <div class="ai">
    <h3>AI Assistant</h3>
    <div class="airow">
      <input id="q" placeholder="Ask for tips..." />
      <button id="ask">Ask</button>
    </div>
    <div class="aireply" id="reply"></div>
  </div>
</div>
<script>
var KEY='habits';
var habits=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(habits));}
function render(){
  var list=document.getElementById('list');
  list.innerHTML='';
  var done=habits.filter(function(h){return h.done;}).length;
  document.getElementById('sub').textContent=habits.length?(done+' of '+habits.length+' done today'):'Add your first habit';
  if(habits.length && done===habits.length){setTimeout(confetti,200);}
  if(!habits.length){list.innerHTML='<div class="empty">No habits yet</div>';return;}
  habits.forEach(function(h,i){
    var card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="cb '+(h.done?'done':'')+'" data-i="'+i+'">'+(h.done?'✓':'')+'</div><div class="name '+(h.done?'done':'')+'">'+escapeHtml(h.name)+'</div><button class="del" data-d="'+i+'">✕</button>';
    list.appendChild(card);
  });
}
function escapeHtml(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
document.getElementById('addBtn').onclick=function(){
  var v=document.getElementById('habitInput').value.trim();
  if(!v)return;
  habits.push({name:v,done:false});
  document.getElementById('habitInput').value='';
  save();render();
};
document.getElementById('habitInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('addBtn').click();});
document.getElementById('list').onclick=function(e){
  if(e.target.dataset.i!==undefined){habits[e.target.dataset.i].done=!habits[e.target.dataset.i].done;save();render();}
  if(e.target.dataset.d!==undefined){habits.splice(e.target.dataset.d,1);save();render();}
};
var TIPS=['Start small: one habit at a time.','Consistency beats intensity.','Track daily, even tiny wins count.','Pair a new habit with an existing routine.','Never miss twice.','2-minute rule: just start.'];
document.getElementById('ask').onclick=function(){
  var q=document.getElementById('q').value.trim();
  var reply=document.getElementById('reply');
  if(!q){reply.textContent='Ask me anything.';return;}
  reply.textContent=TIPS[Math.floor(Math.random()*TIPS.length)];
  document.getElementById('q').value='';
};
function confetti(){
  for(var i=0;i<50;i++){
    var c=document.createElement('div');
    c.style.cssText='position:fixed;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:hsl('+(Math.random()*360)+',80%,60%);pointer-events:none;z-index:9999;';
    document.body.appendChild(c);
    var a=Math.random()*Math.PI*2,d=80+Math.random()*120;
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=function(){c.remove();};
  }
}
render();
</script>
</body>
</html>
